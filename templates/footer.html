<style>
    .mega-footer { background: var(--bg-footer); border-top: 1px solid var(--card-border); padding: 80px 5% 20px; font-size: 0.95em; }
    .footer-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px; margin-bottom: 60px; }
    .footer-brand { max-width: 450px; }
    
    /* Logo Colors Locked */
    .logo-text .virt { color: var(--text-main) !important; } 
    .logo-text .uole { color: var(--primary) !important; } 
    
    .footer-brand p { color: var(--text-muted); line-height: 1.6; margin-top: 15px; }
    .footer-newsletter { background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 12px; flex: 1; max-width: 500px; }
    .footer-newsletter h3 { font-family: 'Montserrat', sans-serif; margin-bottom: 10px; font-size: 1.4em; }
    .footer-newsletter form { display: flex; gap: 10px; }
    .footer-newsletter button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    
    .footer-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 25px; flex-wrap: wrap; gap: 20px; color: var(--text-muted); }
    
    .social-circles { display: flex; gap: 12px; }
    .social-circles a { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); transition: 0.3s; }
    .social-circles a:hover { background: var(--primary); border-color: var(--primary); color: white; }

    /* Centering everything in mobile view */
    @media (max-width: 850px) {
        .footer-top, .footer-bottom { flex-direction: column; align-items: center; text-align: center; }
        .footer-brand { align-items: center; }
        .social-circles { justify-content: center; }
        .footer-newsletter { width: 100%; }
    }
</style>

<footer class="mega-footer">
    <div class="footer-top">
        <div class="footer-brand">
            <a href="/" class="logo-container">
                <img src="https://fkrxuptprlhfedlyanzf.supabase.co/storage/v1/object/public/logo/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                <div class="logo-text"><span class="virt">VIRTU</span><span class="uole">OLE</span></div>
            </a>
            <p>Architecting the next generation of engineers through rigorous virtual internships.</p>
        </div>
        <div class="footer-newsletter">
            <h3>Subscribe to the Matrix</h3>
            <form action="/subscribe" method="POST">
                <input type="email" name="email" placeholder="Enter your email" required>
                <button type="submit">Subscribe ↗</button>
            </form>
        </div>
    </div>
    <div class="footer-bottom">
        <div class="copyright">© 2026 Virtuole. All rights reserved.</div>
        <div class="social-circles">
            <!-- Your SVG Social Icons Here -->
        </div>
    </div>
</footer>
