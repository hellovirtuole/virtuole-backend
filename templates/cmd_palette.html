<style>
    .cmd-palette-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(5px);
        z-index: 9999;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .cmd-palette-overlay.active {
        display: flex;
        opacity: 1;
    }
    .cmd-palette {
        width: 100%;
        max-width: 600px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid #334155;
        overflow: hidden;
        transform: scale(0.95);
        transition: transform 0.2s;
    }
    .cmd-palette-overlay.active .cmd-palette {
        transform: scale(1);
    }
    .cmd-input-wrapper {
        padding: 20px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
    }
    .cmd-input-wrapper span {
        color: #94a3b8;
        font-size: 1.2em;
        margin-right: 15px;
    }
    #cmd-input {
        width: 100%;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.2em;
        outline: none;
    }
    .cmd-results {
        max-height: 400px;
        overflow-y: auto;
        padding: 10px 0;
    }
    .cmd-item {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        color: #cbd5e1;
        text-decoration: none;
        cursor: pointer;
    }
    .cmd-item:hover, .cmd-item.selected {
        background: #3b82f6;
        color: white;
    }
    .cmd-item .shortcut {
        margin-left: auto;
        background: #334155;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.8em;
        color: #94a3b8;
    }
    .cmd-item:hover .shortcut, .cmd-item.selected .shortcut {
        background: rgba(255,255,255,0.2);
        color: white;
    }
</style>

<div class="cmd-palette-overlay" id="cmdPaletteOverlay">
    <div class="cmd-palette">
        <div class="cmd-input-wrapper">
            <span>🔍</span>
            <input type="text" id="cmd-input" placeholder="Search commands, pages, or tools... (Esc to close)" autocomplete="off">
        </div>
        <div class="cmd-results" id="cmd-results">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<script>
    const userRole = "{{ session['role'] }}";
    const commands = [
        { label: "Go to Dashboard", url: "/dashboard-" + (userRole || 'intern'), icon: "🏠", roles: ["intern", "admin", "mentor", "ambassador"] },
        { label: "View Active Tasks", url: "/dashboard-intern", icon: "📋", roles: ["intern"] },
        { label: "Submit Project", url: "/submit-project", icon: "🚀", roles: ["intern"] },
        { label: "Support & Help", url: "mailto:support@virtuole.in", icon: "🆘", roles: ["intern", "ambassador"] },
        { label: "Manage Users", url: "/dashboard-admin", icon: "👥", roles: ["admin"] },
        { label: "Pending Evaluations", url: "/dashboard-admin", icon: "⚖️", roles: ["admin", "mentor"] },
        { label: "View Payments", url: "/dashboard-admin", icon: "💳", roles: ["admin"] },
        { label: "Referral Link", url: "/dashboard-ambassador", icon: "🔗", roles: ["ambassador"] },
        { label: "Log Out", url: "/logout", icon: "🚪", roles: ["intern", "admin", "mentor", "ambassador"] }
    ];

    const overlay = document.getElementById('cmdPaletteOverlay');
    const input = document.getElementById('cmd-input');
    const resultsContainer = document.getElementById('cmd-results');
    let selectedIndex = 0;

    function renderResults(query = "") {
        resultsContainer.innerHTML = '';
        const filtered = commands.filter(c => 
            (c.roles.includes(userRole) || !userRole) && 
            c.label.toLowerCase().includes(query.toLowerCase())
        );

        if (filtered.length === 0) {
            resultsContainer.innerHTML = '<div style="padding: 20px; color: #64748b; text-align: center;">No results found.</div>';
            return;
        }

        filtered.forEach((cmd, index) => {
            const div = document.createElement('a');
            div.href = cmd.url;
            div.className = 'cmd-item' + (index === selectedIndex ? ' selected' : '');
            div.innerHTML = `<span>${cmd.icon}</span> <span>${cmd.label}</span> <span class="shortcut">↵</span>`;
            
            div.addEventListener('mouseenter', () => {
                selectedIndex = index;
                renderResults(input.value);
            });
            
            resultsContainer.appendChild(div);
        });
    }

    function togglePalette() {
        if (overlay.classList.contains('active')) {
            overlay.classList.remove('active');
            input.blur();
        } else {
            overlay.classList.add('active');
            input.value = '';
            selectedIndex = 0;
            renderResults();
            setTimeout(() => input.focus(), 100);
        }
    }

    document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            togglePalette();
        }
        
        if (!overlay.classList.contains('active')) return;

        const items = resultsContainer.querySelectorAll('.cmd-item');
        if (e.key === 'Escape') {
            togglePalette();
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = (selectedIndex + 1) % items.length;
            renderResults(input.value);
            items[selectedIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            renderResults(input.value);
            items[selectedIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (items[selectedIndex]) items[selectedIndex].click();
        }
    });

    input.addEventListener('input', (e) => {
        selectedIndex = 0;
        renderResults(e.target.value);
    });
</script>
