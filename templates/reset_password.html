<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Virtuole</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0;
            font-family: 'Inter', sans-serif; color: var(--text-main); }

        .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 110px 20px 60px; }
        .auth-container { width: 100%; max-width: 440px; padding: 42px 34px; text-align: center; }

        .auth-logo { font-family: 'Space Grotesk','Montserrat',sans-serif; font-size: 2em; font-weight: 800;
            letter-spacing: 2px; margin-bottom: 8px; }
        .auth-logo .virt { color: var(--text-main); }
        .auth-logo .uole { color: var(--primary); }
        p.subtitle { color: var(--text-muted); font-size: 0.96em; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; color: var(--text-muted); font-size: 0.88em; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text-main); font-family: 'Inter', sans-serif; transition: 0.25s; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45,212,191,0.18); }

        .password-wrapper { position: relative; }
        .toggle-password { position: absolute; right: 12px; top: 12px; cursor: pointer; font-size: 1.1em;
            user-select: none; opacity: 0.7; transition: 0.2s; }
        .toggle-password:hover { opacity: 1; }

        .submit-btn { width: 100%; margin-top: 8px; }

        .alert-error { background: rgba(245, 101, 101, 0.12); border-left: 4px solid #f56565; color: #f87171;
            padding: 12px 14px; margin-bottom: 20px; font-size: 0.9em; text-align: left; border-radius: 8px; display: none; }

        {% if error %}
        .alert-error.server { display: block; }
        {% endif %}
    </style>
    {% include 'theme.html' %}
</head>
<body>
    <div class="aurora-bg"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
    {% include 'navbar.html' %}

    <main class="auth-shell">
        <div class="au-card auth-container reveal">
            <a href="/" style="text-decoration: none;"><div class="auth-logo"><span class="virt">VIRTU</span><span class="uole">OLE</span></div></a>
            <p class="subtitle">🔐 Secure Password Recovery</p>

            <div class="alert-error server" id="error-msg">⚠️ {{ error }}</div>

            <form id="reset-form" action="/update-password" method="POST">
                <!-- Hidden inputs to securely pass the Supabase tokens to Python -->
                <input type="hidden" name="access_token" id="access_token">
                <input type="hidden" name="refresh_token" id="refresh_token">

                <div class="form-group">
                    <label>New Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword('confirm_password', this)">👁️</span>
                    </div>
                </div>

                <button type="submit" class="au-btn submit-btn" id="action-btn">Update Password</button>
            </form>
        </div>
    </main>

    {% include 'footer.html' %}

    <script>
        // Extract secure Supabase tokens from the URL Hash
        window.onload = function() {
            if (window.location.hash) {
                // Supabase puts tokens in the hash: #access_token=123&refresh_token=456
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);

                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');

                if (accessToken && refreshToken) {
                    document.getElementById('access_token').value = accessToken;
                    document.getElementById('refresh_token').value = refreshToken;
                } else {
                    showError("Invalid link format. Please request a new reset email.");
                }
            } else {
                // If there is no hash and no backend error, the link is broken
                const errorBox = document.getElementById('error-msg');
                if (!errorBox.innerText.includes('⚠️') || errorBox.innerText.trim() === '⚠️') {
                    showError("No authorization token found in URL. Please use the exact link from your email.");
                }
            }
        };

        function showError(msg) {
            const errorBox = document.getElementById('error-msg');
            errorBox.style.display = 'block';
            errorBox.innerText = "⚠️ " + msg;
            document.getElementById('action-btn').disabled = true;
            document.getElementById('action-btn').style.opacity = '0.5';
            document.getElementById('action-btn').style.cursor = 'not-allowed';
        }

        // Toggle Show/Hide Password
        function togglePassword(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                iconElement.innerText = "🙈";
            } else {
                field.type = "password";
                iconElement.innerText = "👁️";
            }
        }

        // Prevent submission if passwords do not match
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            const pass = document.getElementById('password').value;
            const conf = document.getElementById('confirm_password').value;

            if (pass !== conf) {
                e.preventDefault();
                const errorBox = document.getElementById('error-msg');
                errorBox.style.display = 'block';
                errorBox.innerText = "⚠️ Passwords do not match. Please try again.";
            }
        });
    </script>
</body>
</html>
